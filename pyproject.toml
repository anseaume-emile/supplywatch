[project]
name = "supplywatch"
version = "0.1.0"
description = "Procurement view of the components in the CDDS Altium projects: stock, lead time, lifecycle, COO and shortages."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.40",
    "httpx==0.28.1",
    "apscheduler==3.11.0",
    "python-multipart==0.0.20",
    "cryptography==44.0.3",
    "psycopg[binary]==3.2.9",
    "olefile==0.47",
    "pycountry==24.6.1",
    "mcp==1.27.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "respx==0.22.0",
    "ruff==0.14.4",
    "ty==0.0.1a25",
    "pre-commit==4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplywatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Recorded API responses and CSV fixtures are kept verbatim.
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as Depends()/Query() defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body", "fastapi.Header"]

[tool.ty.environment]
python-version = "3.12"
